# Eddie fork only: build the Python server image from this branch and deploy
# it to the single-server host. Never publishes upstream xinnan-tech tags.
name: Eddie server image and deploy

on:
  push:
    branches: [eddie]
  pull_request:
    branches: [eddie]
  workflow_dispatch:

concurrency:
  group: eddie-server-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR requires a lowercase owner.
  IMAGE_NAME: ghcr.io/eddieipeace/xiaozhi-esp32-server
  DEPLOY_DIR: /home/ubuntu/xiaozhi-server

jobs:
  test-ota-allowlist:
    name: Eddie-fork unit tests
    if: github.repository == 'EddieIPeace/xiaozhi-esp32-server'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/xiaozhi-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test deps
        run: pip install pytest

      - name: Run eddie-fork tests
        run: pytest -c /dev/null --noconftest -o cache_dir=/tmp/pytest-eddie tests/test_ota_allowlist.py tests/test_doubao_stream_auth.py -q

  build:
    name: Build and push server image
    needs: test-ota-allowlist
    if: >
      github.repository == 'EddieIPeace/xiaozhi-esp32-server' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          sha_tag="sha-${GITHUB_SHA}"
          echo "image=${IMAGE_NAME}:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-server
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:eddie
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha,scope=eddie-server
          cache-to: type=gha,mode=max,scope=eddie-server

  deploy:
    name: Deploy over SSH
    needs: build
    if: >
      github.repository == 'EddieIPeace/xiaozhi-esp32-server' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy secrets
        run: |
          missing=0
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then echo "missing DEPLOY_HOST"; missing=1; fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then echo "missing DEPLOY_USER"; missing=1; fi
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then echo "missing DEPLOY_SSH_KEY"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the repository secrets documented in docs/EDDIE_FORK.md"
            exit 1
          fi

      - name: Prepare SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          port="${DEPLOY_PORT:-22}"
          printf '%s\n' "${DEPLOY_SSH_KEY}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${port}" -T 15 "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Copy deploy script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          scp -i ~/.ssh/deploy_key -P "${port}" \
            scripts/eddie-deploy-remote.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/eddie-deploy-remote.sh"

      - name: Pull image and recreate container
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          # Token is piped on stdin so it is not visible in remote argv.
          printf '%s\n' "${GHCR_TOKEN}" | ssh -i ~/.ssh/deploy_key -p "${port}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "IFS= read -r GHCR_TOKEN && export GHCR_TOKEN && \
             chmod +x /tmp/eddie-deploy-remote.sh && \
             /tmp/eddie-deploy-remote.sh '${NEW_IMAGE}' '${DEPLOY_DIR}' '${GITHUB_ACTOR}' && \
             rm -f /tmp/eddie-deploy-remote.sh"
